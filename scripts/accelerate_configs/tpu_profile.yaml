# TPU config with profiling enabled
# Use this to identify performance bottlenecks
# Profile will be saved to /tmp/xla_profile/
#
# View traces with: tensorboard --logdir=/tmp/xla_profile
compute_environment: LOCAL_MACHINE
debug: false
distributed_type: XLA
downcast_bf16: 'no'
machine_rank: 0
main_training_function: main
num_machines: 1
num_processes: 8
rdzv_backend: static
same_network: true
tpu_env:
  - TORCH_COMPILE_DISABLE=1
  - DS_ACCELERATOR=cpu
  # Enable XLA profiling via callback (profiles steps 10-20 by default)
  - DLLM_XLA_PROFILE=1
  # XLA performance optimizations
  - XLA_USE_SPMD=1
  - XLA_IR_DEBUG=0
  - XLA_HLO_DEBUG=0
  # Reduce host-device sync overhead
  - XLA_SYNC_WAIT=0
  # Enable persistent compilation cache
  - XLA_PERSISTENT_CACHE_PATH=/tmp/xla_cache
  # Silence TF logging
  - TF_CPP_MIN_LOG_LEVEL=2
  # XLA compiler optimization flags
  - XLA_FLAGS=--xla_gpu_force_compilation_parallelism=8 --xla_gpu_enable_fast_min_max=true
  # Use bfloat16 for faster computation
  - XLA_USE_BF16=1
tpu_use_cluster: false
tpu_use_sudo: false
use_cpu: false
