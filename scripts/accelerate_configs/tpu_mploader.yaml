# TPU config with MpDeviceLoader for async data prefetching
# This overlaps data loading with computation to hide CPU->TPU transfer latency
compute_environment: LOCAL_MACHINE
debug: false
distributed_type: XLA
downcast_bf16: 'no'
machine_rank: 0
main_training_function: main
num_machines: 1
num_processes: 8
rdzv_backend: static
same_network: true
tpu_env:
  - TORCH_COMPILE_DISABLE=1
  - DS_ACCELERATOR=cpu
  # Enable MpDeviceLoader for async data prefetching
  - DLLM_XLA_MP_DEVICE_LOADER=1
  # XLA performance optimizations
  - XLA_USE_SPMD=1
  - XLA_IR_DEBUG=0
  - XLA_HLO_DEBUG=0
  # Reduce host-device sync overhead
  - XLA_SYNC_WAIT=0
  # Enable persistent compilation cache
  - XLA_PERSISTENT_CACHE_PATH=/tmp/xla_cache
  # Silence TF logging
  - TF_CPP_MIN_LOG_LEVEL=2
  # XLA compiler optimization flags
  - XLA_FLAGS=--xla_gpu_force_compilation_parallelism=8 --xla_gpu_enable_fast_min_max=true
  # Use bfloat16 for faster computation
  - XLA_USE_BF16=1
tpu_use_cluster: false
tpu_use_sudo: false
use_cpu: false
